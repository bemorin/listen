[package]
name = "hello"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["sw"]
sw = ["slint/renderer-software"]
gl = ["slint/renderer-femtovg"]

[dependencies]
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
