name: Listen

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    paths:
      - "cross/**"
      - ".github/workflows/cross.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: windows-x64
          - name: macOS arm64
            os: macos-latest
            target: macos-arm64
          - name: macOS x64
            os: macos-13
            target: macos-x64
          - name: Linux x64
            os: ubuntu-22.04
            target: linux-x64
    defaults:
      run:
        working-directory: cross
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libdbus-1-dev libfontconfig1-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cross

      - name: Unit tests
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      # The version: the tag on tagged builds (v2.0.0 -> 2.0.0), else Cargo.toml's.
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ARCHIVE=Listen-$version-${{ matrix.target }}" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist/Listen
          cp target/release/listen.exe dist/Listen/Listen.exe
          cp ../LICENSE.md dist/Listen/
          cd dist && 7z a -tzip "$ARCHIVE.zip" Listen >/dev/null
          ls -l

      - name: Package (macOS app bundle)
        if: runner.os == 'macOS'
        run: |
          app=dist/Listen.app/Contents
          mkdir -p "$app/MacOS" "$app/Resources"
          cp target/release/listen "$app/MacOS/listen"
          sed "s/__VERSION__/$VERSION/g" assets/macos/Info.plist > "$app/Info.plist"
          # Icon from cross/assets/icon-512.png.
          iconset=$(mktemp -d)/Listen.iconset
          mkdir -p "$iconset"
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon-512.png --out "$iconset/icon_${s}x${s}.png" >/dev/null
            sips -z $((s*2)) $((s*2)) assets/icon-512.png --out "$iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Resources/Listen.icns" || true
          codesign --force --deep --sign - dist/Listen.app || true
          cd dist && ditto -c -k --keepParent Listen.app "$ARCHIVE.zip"
          ls -l

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "dist/Listen"
          cp target/release/listen dist/Listen/listen
          cp ../LICENSE.md dist/Listen/
          tar -C dist -czf "dist/$ARCHIVE.tar.gz" Listen
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: |
            cross/dist/*.zip
            cross/dist/*.tar.gz
          if-no-files-found: error

  # A pushed v* tag publishes the four archives as a GitHub Release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
