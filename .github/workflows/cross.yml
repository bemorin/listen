name: Listen cross-platform

on:
  push:
    paths:
      - "cross/**"
      - ".github/workflows/cross.yml"
  pull_request:
    paths:
      - "cross/**"
      - ".github/workflows/cross.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: Listen-windows-x64
          - name: macOS arm64
            os: macos-latest
            artifact: Listen-macos-arm64
          - name: macOS x64
            os: macos-13
            artifact: Listen-macos-x64
          - name: Linux x64
            os: ubuntu-22.04
            artifact: Listen-linux-x64
    defaults:
      run:
        working-directory: cross
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libdbus-1-dev libfontconfig1-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cross

      - name: Unit tests
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist
          cp target/release/listen.exe dist/Listen.exe
          ls -l dist

      - name: Package (macOS app bundle)
        if: runner.os == 'macOS'
        run: |
          version=$(cat ../VERSION | tr -d '[:space:]')
          app=dist/Listen.app/Contents
          mkdir -p "$app/MacOS" "$app/Resources"
          cp target/release/listen "$app/MacOS/listen"
          sed "s/__VERSION__/$version/g" assets/macos/Info.plist > "$app/Info.plist"
          # Icon from the shared 512 px PNG.
          iconset=$(mktemp -d)/Listen.iconset
          mkdir -p "$iconset"
          for s in 16 32 128 256 512; do
            sips -z $s $s ../build/icon.png --out "$iconset/icon_${s}x${s}.png" >/dev/null
            sips -z $((s*2)) $((s*2)) ../build/icon.png --out "$iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Resources/Listen.icns" || true
          codesign --force --deep --sign - dist/Listen.app || true
          ls -l "$app/MacOS"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/listen dist/listen
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: cross/dist
          if-no-files-found: error
